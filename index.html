<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>for raffy 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#ffd6e7,
#ffeef7
);
}

/* CARD */

.card{
background:rgba(255,255,255,0.75);
backdrop-filter:blur(10px);
padding:35px;
border-radius:30px;
text-align:center;
width:370px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
z-index:10;
position:relative;
animation:float 3s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0);
}

}

h1{
color:#ff4f81;
margin-bottom:10px;
font-size:32px;
}

p{
color:#666;
line-height:1.6;
}

input{
margin-top:20px;
padding:12px;
width:80%;
border-radius:15px;
border:1px solid #ddd;
outline:none;
font-size:15px;
}

button{
margin-top:20px;
padding:12px 24px;
border:none;
border-radius:20px;
background:linear-gradient(
135deg,
#ff6fa5,
#ff4f81
);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* FLOWERS */

.flowerRain{
position:absolute;
font-size:28px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{

from{
transform:
translateY(-100px)
rotate(0deg);

opacity:1;
}

to{
transform:
translateY(110vh)
rotate(360deg);

opacity:0;
}

}

#message{
margin-top:25px;
font-weight:bold;
color:#ff4f81;
min-height:60px;
line-height:1.8;
font-size:16px;
}

.sparkle{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
opacity:0.8;
}

@keyframes twinkle{

0%{
opacity:0.2;
transform:scale(1);
}

50%{
opacity:1;
transform:scale(1.8);
}

100%{
opacity:0.2;
transform:scale(1);
}

}

</style>
</head>

<body>

<!-- MUSIC -->
<audio
id="bgmusic"
src="lagu.mp3"
loop>
</audio>

<!-- CARD -->
<div class="card">

<h1>haiii 💖</h1>

<p>
masukin nama kamuu 😳
</p>

<input
type="text"
id="nameInput"
placeholder="masukin nama kamuu 😳"
>

<br>

<button onclick="startLove()">
click me fr 🌸
</button>

<div id="message"></div>

</div>

<script>

function startLove(){

const name =
document.getElementById(
"nameInput"
).value;

const message =
document.getElementById(
"message"
);

if(name === ""){

message.innerHTML =
"minimal masukin nama dulu 😭";

return;

}

// PLAY MUSIC
document.getElementById(
"bgmusic"
).play();

// MESSAGE
message.innerHTML =

`haii ${name} 💖<br><br>

have a good day yaa! 🌸<br>

this flower for u 🌹<br><br>

from alena cantik 😋`;


// MASSIVE FLOWER RAIN

for(let i=0; i<120; i++){

setTimeout(()=>{
createFlower();
}, i*80);

}

}

// FLOWER FUNCTION

function createFlower(){

const flower =
document.createElement("div");

flower.classList.add(
"flowerRain"
);

const flowers = [

"🌹",
"🌺",
"🌸",
"💮",
"🌷"

];

flower.innerHTML =

flowers[
Math.floor(
Math.random()*flowers.length
)
];

flower.style.left =
Math.random()*100 + "vw";

flower.style.animationDuration =
(Math.random()*4+4)+"s";

flower.style.fontSize =
(Math.random()*30+20)+"px";

document.body.appendChild(
flower
);

setTimeout(()=>{

flower.remove();

},8000);

}

// SPARKLES

function createSparkle(){

const sparkle =
document.createElement("div");

sparkle.classList.add(
"sparkle"
);

sparkle.style.left =
Math.random()*100 + "vw";

sparkle.style.top =
Math.random()*100 + "vh";

document.body.appendChild(
sparkle
);

setTimeout(()=>{

sparkle.remove();

},2000);

}

setInterval(createSparkle,200);

</script>

</body>
</html>
