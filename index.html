<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>for raffy 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#ffd6e7,
#ffeef7
);
}

/* CARD */

.card{
background:white;
padding:35px;
border-radius:30px;
text-align:center;
width:370px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
z-index:10;
position:relative;
}

h1{
color:#ff4f81;
margin-bottom:10px;
}

p{
color:#666;
line-height:1.6;
}

input{
margin-top:20px;
padding:12px;
width:80%;
border-radius:15px;
border:1px solid #ddd;
outline:none;
}

button{
margin-top:20px;
padding:12px 24px;
border:none;
border-radius:20px;
background:#ff4f81;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

/* FLOWER */

.flower{
position:absolute;
bottom:-100px;
width:180px;
height:180px;
opacity:0;
transition:2s;
}

.petal{
position:absolute;
width:70px;
height:70px;
background:#ff6fa5;
border-radius:50%;
left:55px;
top:55px;
transform-origin:center;
}

.p1{ transform:translateY(-45px); }
.p2{ transform:translateY(45px); }
.p3{ transform:translateX(-45px); }
.p4{ transform:translateX(45px); }

.center{
position:absolute;
width:60px;
height:60px;
background:#ffd54f;
border-radius:50%;
left:60px;
top:60px;
}

.stem{
position:absolute;
width:10px;
height:150px;
background:#3cb371;
left:85px;
top:120px;
border-radius:20px;
}

/* HEARTS */

.heart{
position:absolute;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{

from{
transform:translateY(-100px);
opacity:1;
}

to{
transform:translateY(100vh);
opacity:0;
}

}

#message{
margin-top:20px;
font-weight:bold;
color:#ff4f81;
min-height:40px;
}

</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgmusic" src="lagu.mp3"></audio>

<!-- FLOWER -->
<div class="flower" id="flower">

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>

<div class="center"></div>

<div class="stem"></div>

</div>

<!-- CARD -->
<div class="card">

<h1>hey you 💖</h1>

<p>
type your name first 😳
</p>

<input
type="text"
id="nameInput"
placeholder="your name..."
>

<br>

<button onclick="startLove()">
click me fr
</button>

<div id="message"></div>

</div>

<script>

function startLove(){

const name =
document.getElementById(
"nameInput"
).value;

const message =
document.getElementById(
"message"
);

if(name === ""){

message.innerHTML =
"bro at least type your name 😭";

return;

}

// MUSIC
document.getElementById(
"bgmusic"
).play();

// MESSAGE
message.innerHTML =
`hey ${name} 💖<br>
alena lowkey made this for u 😔`;

// FLOWER BLOOM
const flower =
document.getElementById(
"flower"
);

flower.style.opacity = "1";

flower.style.transform =
"translateY(-180px) scale(1.2) rotate(360deg)";

}

// HEART RAIN

function createHeart(){

const heart =
document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "💖";

heart.style.left =
Math.random()*100 + "vw";

heart.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(
heart
);

setTimeout(()=>{
heart.remove();
},5000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
